name: Deploy Frontend to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production_frontend_deploy
  cancel-in-progress: false

jobs:
  build-frontend:
    name: Build Next.js Static Export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies & Build
        run: |
          npm ci || npm install
          npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL || 'https://sentradesa.id/api/v1' }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://sentradesa.id' }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-out
          path: out/
          retention-days: 1

  deploy:
    name: Deploy Frontend (Next.js) to VPS
    runs-on: ubuntu-latest
    needs: build-frontend
    env:
      VPS_HOST: ${{ secrets.VPS_HOST || '45.80.181.191' }}
      VPS_USER: ${{ secrets.VPS_USER || 'root' }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      TARGET_DIR: ${{ secrets.VPS_FRONTEND_DIR || '/var/www/html/sentradesa.id/nextjs' }}
    steps:
      - name: Download Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-out
          path: out

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Configure SSH Known Hosts & KeepAlive
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ env.VPS_PORT }} -H ${{ env.VPS_HOST }} >> ~/.ssh/known_hosts
          cat << 'EOF' >> ~/.ssh/config
          Host *
            ServerAliveInterval 30
            ServerAliveCountMax 5
            StrictHostKeyChecking accept-new
          EOF
          chmod 600 ~/.ssh/config

      - name: Ensure Target Directory Exists
        run: |
          ssh -p ${{ env.VPS_PORT }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} "mkdir -p ${{ env.TARGET_DIR }}"

      - name: Deploy Frontend via Rsync
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ env.VPS_PORT }} -o ServerAliveInterval=30 -o ServerAliveCountMax=5" \
            out/ ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:${{ env.TARGET_DIR }}/

      - name: Set Permissions & Reload Nginx
        run: |
          ssh -p ${{ env.VPS_PORT }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} "
            set -e
            echo '==> 1. Mengatur permission web server...'
            chown -R www-data:www-data ${{ env.TARGET_DIR }}
            chmod -R 755 ${{ env.TARGET_DIR }}
            
            echo '==> 2. Reload Nginx...'
            nginx -t && systemctl reload nginx
            
            echo '==> DEPLOY FRONTEND BERHASIL!'
          "
